name: hawkwatch

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: hawkwatch
      POSTGRES_PASSWORD: hawkwatch
      POSTGRES_DB: hawkwatch
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hawkwatch"]
      interval: 5s
      retries: 10

  # S3-compatible object storage for local dev (stands in for AWS S3).
  s3:
    image: chrislusf/seaweedfs:latest
    command: server -dir=/data -s3 -s3.port=9000 -s3.config=/etc/seaweedfs/s3.json
    ports: ["9000:9000"]
    volumes:
      - s3data:/data
      - ./seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro

volumes:
  pgdata:
  s3data:
