[project]
name = "hawkwatch-worker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.6",
  "boto3>=1.35",
  "opencv-python-headless>=4.10",
  "numpy>=2.0",
]

[project.optional-dependencies]
# Heavy model deps — install with `uv sync --extra models`
models = ["torch>=2.5", "transformers>=4.46", "ultralytics>=8.3", "mediapipe>=0.10"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100
